name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hiretrack
          POSTGRES_PASSWORD: hiretrack
          POSTGRES_DB: hiretrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiretrack -d hiretrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://hiretrack:hiretrack@localhost:5432/hiretrack

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models and migrations match
        run: uv run alembic check

      - name: Create the test database
        run: PGPASSWORD=hiretrack psql -h localhost -U hiretrack -d hiretrack -c "CREATE DATABASE hiretrack_test;"

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=90
